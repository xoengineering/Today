name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cibuild:
    name: Lint, test, build
    # The macos-26 image stops at Xcode 26.6 and Swift 6.3. The app needs Xcode 27, which only this preview image has.
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: TodayKit/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('TodayKit/Package.resolved', 'TodayKit/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Install tools
        run: |
          brew install xcodegen swiftlint

      # script/build skips signing when CI is set, since runners have no identity.
      - name: Lint, test, and build both platforms
        run: script/cibuild
